# Install: sudo cp deploy/ec2/nginx/interlabour.conf /etc/nginx/sites-available/interlabour
# Enable:  sudo ln -sf /etc/nginx/sites-available/interlabour /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d interlabour.nl -d www.interlabour.nl

upstream interlabour_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name interlabour.nl www.interlabour.nl;

    client_max_body_size 25M;

    location /assets/ {
        alias /var/www/interlabour/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/interlabour/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://interlabour_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
